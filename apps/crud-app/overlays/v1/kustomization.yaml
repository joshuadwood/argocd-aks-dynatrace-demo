apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: crud-app:placeholder
    newName: acrargocddemo28261.azurecr.io/crud-app
    newTag: v1.0.0
patches:
  - target:
      kind: Deployment
      name: crud-app
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/5/value
        value: "1.0.0"
      - op: replace
        path: /spec/template/spec/containers/0/env/6/value
        value: "items-crud"
