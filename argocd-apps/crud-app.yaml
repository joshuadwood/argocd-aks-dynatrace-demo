apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crud-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/joshuadwood/argocd-aks-dynatrace-demo.git
    targetRevision: main
    path: apps/crud-app/overlays/v1
  destination:
    server: https://kubernetes.default.svc
    namespace: crud
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
