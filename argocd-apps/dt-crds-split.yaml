apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dt-crds-split
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/joshuadwood/argocd-aks-dynatrace-demo.git
    targetRevision: main
    # CRDs only — bump this path to change CRD version, independent of the operator app
    path: dynatrace-split/crds/v1.8.0
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false # never auto-prune CRDs
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
