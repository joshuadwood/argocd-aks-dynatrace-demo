apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dt-operator-split
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://raw.githubusercontent.com/Dynatrace/helm-charts/master/repos/stable
      chart: dynatrace-operator
      targetRevision: 1.7.3
      helm:
        values: |
          installCRD: false
          platform: kubernetes
    - repoURL: https://github.com/joshuadwood/argocd-aks-dynatrace-demo.git
      targetRevision: main
      path: dynatrace-split/operator-extras/v1beta5
  destination:
    server: https://kubernetes.default.svc
    namespace: dynatrace-split
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
