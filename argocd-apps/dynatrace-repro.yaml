apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dynatrace-repro
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://raw.githubusercontent.com/Dynatrace/helm-charts/master/repos/stable
      chart: dynatrace-operator
      targetRevision: 1.0.0
      helm:
        values: |
          installCRD: true
          platform: kubernetes
    - repoURL: https://github.com/joshuadwood/argocd-aks-dynatrace-demo.git
      targetRevision: main
      path: dynatrace-repro/overlays/v1beta1-storage
  destination:
    server: https://kubernetes.default.svc
    namespace: dynatrace-repro
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
